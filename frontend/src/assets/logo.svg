<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente de cores: Tailwind Emerald 500 para Sky 500 -->
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>
  
  <!-- Fundo Hexagonal (Proteção e Estrutura) - Cor: Tailwind Slate 900 -->
  <path d="M256 24 L480 152 V360 L256 488 L32 360 V152 Z" fill="#0f172a" />
  
  <!-- Linha do Gráfico Ascendente -->
  <path d="M128 320 L224 224 L288 288 L384 160" fill="none" stroke="url(#growthGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Ponta da Seta do Gráfico -->
  <path d="M288 160 H384 V256" fill="none" stroke="url(#growthGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
</svg>
